name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the Scriptorium pages
        working-directory: scriptorium
        run: node build.js

      - name: Assemble the deployable site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp sw.js _site/
          mkdir -p _site/scriptorium
          cp -r scriptorium/dist/. _site/scriptorium/
          touch _site/.nojekyll

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
