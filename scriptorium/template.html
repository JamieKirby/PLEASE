<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}} — The Burren Scriptorium</title>
<link rel="icon" href="{{SITE_ROOT}}favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="{{SITE_ROOT}}favicon.ico">
<link rel="apple-touch-icon" href="{{SITE_ROOT}}apple-touch-icon.png">
<meta name="description" content="{{SUMMARY}}">
{{HEAD_EXTRA}}
<!-- tokens.css FIRST — it defines the custom properties the other two
     stylesheets consume, and it's the single shared source for the
     palette and type scale across both the map and every page here. The
     old hand-copied :root block in styles.css is gone.

     Every path on this page is relative and computed at build time
     ({{ROOT}} = the Scriptorium root from here, {{SITE_ROOT}} = the repo
     root). Nothing is root-relative and nothing hardcodes an origin, so
     this survives being served from a GitHub Pages project subpath —
     which is exactly the failure the old BASE_URL constant caused. -->
<link rel="stylesheet" href="{{ASSETS}}tokens.css">
<link rel="stylesheet" href="{{ASSETS}}chrome.css">
<link rel="stylesheet" href="{{ROOT}}styles.css">
<!-- Loaded in dependency order, without defer: chrome.js reads
     BurrenConfig and BurrenState at definition time, and these are small
     enough that blocking on them beats the complexity of coordinating
     load events. -->
<script src="{{ASSETS}}site-config.js"></script>
<script src="{{ASSETS}}state.js"></script>
<script src="{{ASSETS}}entry-render.js"></script>
<script src="{{ASSETS}}soundscape.js"></script>
<script src="{{ASSETS}}seam.js"></script>
<script src="{{ASSETS}}chrome.js"></script>
</head>
<body class="theme-{{CATEGORY}}">

  {{CHROME}}

  <main>
{{BODY}}
  </main>

</body>
</html>
