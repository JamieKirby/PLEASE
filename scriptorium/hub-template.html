<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{CATEGORY_TITLE}} — The Burren Scriptorium</title>
<link rel="icon" href="{{SITE_ROOT}}favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="{{SITE_ROOT}}favicon.ico">
<link rel="apple-touch-icon" href="{{SITE_ROOT}}apple-touch-icon.png">
<meta name="description" content="Browse every {{CATEGORY_TITLE}} entry in the Burren Scriptorium.">
{{HEAD_EXTRA}}
<link rel="stylesheet" href="{{ASSETS}}tokens.css">
<link rel="stylesheet" href="{{ASSETS}}chrome.css">
<link rel="stylesheet" href="{{ROOT}}styles.css">
<script src="{{ASSETS}}site-config.js"></script>
<script src="{{ASSETS}}state.js"></script>
<script src="{{ASSETS}}entry-render.js"></script>
<script src="{{ASSETS}}soundscape.js"></script>
<script src="{{ASSETS}}seam.js"></script>
<script src="{{ASSETS}}chrome.js"></script>
</head>
<body class="theme-{{CATEGORY}}">

  {{CHROME}}

  <main>
    <h1>{{CATEGORY_TITLE}}</h1>
    <p class="hub-count">{{ENTRY_COUNT}} entries</p>
    {{FEATURED_SECTION}}
    <h2 class="hub-all-heading">All {{CATEGORY_TITLE}}</h2>
    <ul class="hub-list">
{{ENTRY_LIST}}
    </ul>
  </main>

</body>
</html>
